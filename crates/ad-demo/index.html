<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ad — 可微计算演示</title>
    <link data-trunk rel="rust" data-bin="ad-demo" />
    <style>
        :root {
            --bg: #0b1020;
            --card: #131a2e;
            --border: #23304f;
            --text: #dbe4f5;
            --muted: #8194b8;
            --accent: #38bdf8;
            --accent2: #6ee7b7;
            --warn: #fbbf24;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            line-height: 1.5;
        }
        main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
        header h1 { margin: 8px 0 4px; font-size: 1.7rem; letter-spacing: 0.5px; }
        header h1 em { color: var(--accent); font-style: normal; }
        header p { margin: 0 0 24px; color: var(--muted); }
        section.card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 20px;
        }
        section.card h2 { margin: 0 0 2px; font-size: 1.15rem; }
        section.card h2 .tag {
            font-size: 0.72rem; color: var(--accent2); border: 1px solid var(--accent2);
            border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: middle;
        }
        section.card > p.desc { margin: 2px 0 14px; color: var(--muted); font-size: 0.88rem; }
        .cols { display: flex; flex-wrap: wrap; gap: 20px; }
        .cols > .left { flex: 1 1 260px; min-width: 240px; }
        .cols > .right { flex: 2 1 420px; min-width: 280px; }
        .row { margin: 10px 0; }
        .row label { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--muted); }
        .row label .val { color: var(--accent); font-variant-numeric: tabular-nums; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
        .metric { background: #0e1526; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
        .metric .k { display: block; color: var(--muted); font-size: 0.75rem; }
        .metric .v { font-variant-numeric: tabular-nums; font-size: 1.02rem; }
        .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 0.78rem; margin: 6px 0; }
        .badge.ok { color: var(--accent2); border: 1px solid var(--accent2); }
        .badge.warn { color: var(--warn); border: 1px solid var(--warn); }
        svg.plot { width: 100%; height: auto; background: #0e1526; border: 1px solid var(--border); border-radius: 8px; }
        svg.plot .curve { fill: none; stroke: var(--accent); stroke-width: 1.6; }
        svg.plot .target { stroke: var(--accent2); stroke-width: 1; stroke-dasharray: 5 4; }
        svg.plot .zero { stroke: var(--border); stroke-width: 1; }
        code.inline { color: var(--accent2); background: #0e1526; padding: 1px 6px; border-radius: 5px; font-size: 0.85em; }
        footer { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 32px; }
    </style>
</head>
<body></body>
</html>
