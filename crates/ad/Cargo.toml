[package]
name = "ad"
description = "Reverse-mode AD for physics simulation: facade crate unifying the ad-* modules"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ad-core = { workspace = true }
ad-physics = { workspace = true }
ad-ops = { workspace = true }
ad-custom = { workspace = true }
ad-checkpoint = { workspace = true }
ad-verify = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
ad-optim = { workspace = true }
smallvec = { workspace = true }
criterion = "0.5"

[features]
# 批量 rollout 并行示例（§4.1.6）：仅示例依赖 rayon，库本体零新增依赖
rayon = ["dep:rayon"]

[[example]]
name = "batch_rollout"
required-features = ["rayon"]

[[bench]]
name = "ad_bench"
harness = false
test = false

[lints]
workspace = true
